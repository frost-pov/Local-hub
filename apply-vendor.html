<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="localhub-root" content="." />
  <script>
    (function () {
      var m = document.querySelector('meta[name="localhub-root"]');
      var seg = (m && m.getAttribute('content') || '.').trim() || '.';
      var rootUrl = new URL(seg.replace(/\/?$/, '/'), document.location.href).href;
      var b = document.createElement('base');
      b.href = rootUrl;
      var anchor = document.querySelector('meta[name="localhub-root"]');
      if (anchor) anchor.insertAdjacentElement('afterend', b);
      else document.head.appendChild(b);
    })();
  </script>
  <title>Apply to sell — Local Hub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <script>
    window.__LOCALHUB = window.__LOCALHUB || {
      supabaseUrl: 'https://rbqidaiyxooxdaresxjj.supabase.co',
      supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJicWlkYWl5eG9veGRhcmVzeGpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzUyMjAsImV4cCI6MjA5NDExMTIyMH0.abCE40AXh8vlIDThHRX-p5w21CrTKh3LvTXbcR41igA'
    };
    window.__SOKO = window.__LOCALHUB;
  </script>
</head>
<body>
  <div id="nav-slot"></div>
  <main class="site-wrap page-main">
    <h1 class="section-title reveal">Apply to sell</h1>
    <p class="text-secondary reveal reveal-delay-1">
      You must <a href="auth/login.html?next=apply-vendor.html">sign in</a> first — we&apos;ll queue your shop for approval.
    </p>

    <form id="apply-logged-form" class="mt-3">
      <section data-step="1" class="reveal">
        <h2 class="section-title" style="font-size:1.2rem">1 · Store</h2>
        <div class="card card-body grid" style="gap:0.85rem">
          <div>
            <label class="label" for="store_name">Store name</label>
            <input class="input" id="store_name" required />
          </div>
          <div>
            <label class="label" for="store_slug">URL slug</label>
            <input class="input" id="store_slug" required placeholder="jk-fashion" />
          </div>
          <div>
            <label class="label" for="store_category">Category</label>
            <select class="input" id="store_category" required>
              <option value="">Pick one</option>
              <option value="fashion">Fashion</option>
              <option value="groceries">Groceries</option>
              <option value="services">Services</option>
              <option value="household">Household</option>
            </select>
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_tagline">Tagline</label>
            <input class="input" id="store_tagline" placeholder="One line shoppers see first" maxlength="280" />
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_description">Description</label>
            <textarea class="input" id="store_description" rows="3" placeholder="What you sell"></textarea>
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_story">Your story</label>
            <textarea class="input" id="store_story" rows="2" placeholder="Optional — local roots, ethos"></textarea>
          </div>
          <div>
            <label class="label" for="store_area">Area</label>
            <input class="input" id="store_area" placeholder="Westlands" />
          </div>
          <div>
            <label class="label" for="store_whatsapp">WhatsApp</label>
            <input class="input" id="store_whatsapp" placeholder="2547…" />
          </div>
          <div>
            <label class="label" for="store_payout_phone">M-Pesa payout number</label>
            <input class="input" id="store_payout_phone" placeholder="2547…" />
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_address">Address / landmark</label>
            <textarea class="input" id="store_address" rows="2"></textarea>
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_applicant_notes">Notes for the team</label>
            <textarea class="input" id="store_applicant_notes" rows="2" placeholder="Compliance links, licences, referrals…"></textarea>
          </div>
        </div>
        <button type="button" class="btn btn-primary mt-2" id="apply-s1-next">Continue</button>
      </section>

      <section data-step="2" hidden>
        <h2 class="section-title" style="font-size:1.2rem">2 · Links & media</h2>
        <p class="text-secondary text-sm">Paste image URLs today; uploads can plug into Supabase Storage later.</p>
        <div class="card card-body grid mt-2" style="gap:0.85rem">
          <div style="grid-column:1/-1">
            <label class="label" for="store_logo_url">Logo URL</label>
            <input class="input" id="store_logo_url" type="url" placeholder="https://..." />
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_banner_url">Banner URL</label>
            <input class="input" id="store_banner_url" type="url" placeholder="https://..." />
          </div>
          <div style="grid-column:1/-1">
            <label class="label" for="store_website_url">External site</label>
            <input class="input" id="store_website_url" type="url" placeholder="https:// (optional)" />
          </div>
        </div>
        <div class="mt-2" style="display:flex;gap:0.75rem">
          <button type="button" class="btn btn-ghost" id="apply-s2-back">Back</button>
          <button type="button" class="btn btn-primary" id="apply-s2-next">Continue</button>
        </div>
      </section>

      <section data-step="3" hidden>
        <h2 class="section-title" style="font-size:1.2rem">3 · Agreement</h2>
        <div class="card card-body text-secondary" id="contract-body"></div>
        <div class="card card-body mt-2 grid" style="gap:0.75rem">
          <div>
            <label class="label" for="contract_sign">Type your full name to sign</label>
            <input class="input" id="contract_sign" required />
          </div>
          <label class="text-secondary" style="display:flex;gap:0.5rem;align-items:flex-start">
            <input id="contract_agree" type="checkbox" required />
            <span>I agree to the terms above and understand commission is deducted before payout.</span>
          </label>
        </div>
        <div class="mt-2" style="display:flex;gap:0.75rem">
          <button type="button" class="btn btn-ghost" id="apply-s3-back">Back</button>
          <button type="submit" class="btn btn-primary">Submit application</button>
        </div>
      </section>

      <section data-step="4" hidden class="empty-state">
        <h2>Thanks — you&apos;re in review</h2>
        <p class="mt-2">We&apos;ll email or WhatsApp you. You can keep browsing the marketplace.</p>
        <p class="mt-2"><a class="btn btn-primary" href="index.html">Back home</a></p>
      </section>
    </form>
  </main>
  <div id="footer-slot"></div>
  <script type="module">
    import { bootVendorApplyLoggedIn } from './js/pages/vendor-apply-logged.js';
    bootVendorApplyLoggedIn().catch(console.error);
  </script>
</body>
</html>
